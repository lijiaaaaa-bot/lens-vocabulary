name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -project LensVocabulary.xcodeproj -scheme LensVocabulary -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

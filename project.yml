name: LensVocabulary
options:
  bundleIdPrefix: com.lijiaopensource
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LensVocabulary:
    type: application
    platform: iOS
    sources:
      - LensVocabulary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lijiaopensource.LensVocabulary
        INFOPLIST_FILE: LensVocabulary/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: LensVocabulary/Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Lens Vocabulary uses the camera to read text from another screen locally.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
